[tools]
image=registry.fedoraproject.org/fedora:39
additional_packages="android-tools ansible gh helm lsb_release nc ncdu netcat openssl plocate pwgen yt-dlp"
#additional_packages="pwgen ffmpeg v4l2-ctl yt-dlp"

[gpt]
image=registry.fedoraproject.org/fedora:39
additional_packages="bubblewrap shellcheck"
pre_init_hooks=curl --proto '=https' --tlsv1.2 -fL --retry 3 -o /var/tmp/chatgpt.x86_64.rpm https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm
pre_init_hooks=sudo dnf install -y /var/tmp/chatgpt.x86_64.rpm
exported_apps=chatgpt
init_hooks=curl -fsSL https://chatgpt.com/codex/install.sh | sh

[3rd Party]
image=archlinux:latest
additional_packages="l3afpad"
exported_apps=l3afpad

[organizer]
image=registry.fedoraproject.org/fedora:43
additional_packages="git python3-tkinter"
init_hooks="test -f /opt/simple-organizer/main.py || sudo git clone --depth 1 https://github.com/FreakySneaky787/Simple-Organizer.git /opt/simple-organizer"
init_hooks="echo W0Rlc2t0b3AgRW50cnldClR5cGU9QXBwbGljYXRpb24KTmFtZT1TaW1wbGUgT3JnYW5pemVyCkV4ZWM9cHl0aG9uMyAvb3B0L3NpbXBsZS1vcmdhbml6ZXIvbWFpbi5weQpJY29uPXN5c3RlbS1maWxlLW1hbmFnZXIKVGVybWluYWw9ZmFsc2UKQ2F0ZWdvcmllcz1VdGlsaXR5O0ZpbGVUb29sczsK | base64 -d | sudo tee /usr/share/applications/simple-organizer.desktop >/dev/null"
exported_apps="simple-organizer"
start_now=true

[hermes]
image=registry.fedoraproject.org/fedora:43
additional_packages="git curl tar xz libatomic libXi libxkbcommon gcc gcc-c++ make python3 libX11-devel libXi-devel"
init_hooks="test -x \$HOME/.local/bin/hermes || curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive"
init_hooks="if ! test -x \$HOME/.hermes/hermes-agent/apps/desktop/release/linux-unpacked/Hermes; then CC=/usr/bin/gcc CXX=/usr/bin/g++ \$HOME/.local/bin/hermes desktop --build-only && chown -R \$(stat -c %u:%g \$HOME) \$HOME/.hermes && chown \$(stat -c %u:%g \$HOME) \$HOME/.local/bin/hermes; fi"
start_now=true
exported_apps="$HOME/.local/share/applications/com.nousresearch.hermes.desktop"
